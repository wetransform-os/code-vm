name: ci

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: jdx/mise-action@v3
      - run: mise run fmt-check
      - run: mise run lint
      - run: mise run test:unit
      - run: mise run build

  # The security suite, which is what actually verifies the sandbox holds. It
  # needs nested KVM and a full Lima install, so it is manually dispatched for
  # now: GitHub's Linux runners do expose /dev/kvm, but whether this whole stack
  # comes up on one has never been observed. Dispatch it a few times, and if it
  # proves reliable, add push/pull_request to its trigger and drop the `if`.
  #
  # Until then the suite runs locally via `mise run test:vm`, which means a PR
  # can regress a security control and still show green here.
  vm-suite:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - uses: jdx/mise-action@v3

      # Runners ship /dev/kvm owned by root:kvm without the runner user in that
      # group, so it has to be opened up before QEMU can use it.
      - name: Grant access to /dev/kvm
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -l /dev/kvm

      # Host-level dependencies rather than project toolchain: code-vm treats
      # limactl and virtiofsd the way it treats KVM itself, and `code-vm doctor`
      # checks for them. Lima is pinned to the version the template requires.
      - name: Install Lima and virtiofsd
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq qemu-system-x86 virtiofsd
          LIMA_VERSION=2.2.0
          curl -fsSL "https://github.com/lima-vm/lima/releases/download/v${LIMA_VERSION}/lima-${LIMA_VERSION}-Linux-x86_64.tar.gz" \
            | sudo tar Cxzf /usr/local -
          limactl --version

      # The checkout has to sit under projectsRoot: the suite runs code-vm from
      # the repository directory, and code-vm refuses to run outside a mount.
      - name: Configure code-vm
        run: |
          mkdir -p ~/.config/code-vm
          printf 'projectsRoot: %s\n' "$(dirname "$GITHUB_WORKSPACE")" > ~/.config/code-vm/config.yaml
          mise run build
          ./dist/code-vm doctor

      - run: mise run test:vm

      # First boot is where this is most likely to fail, and the failure is
      # usually inside the guest where the job log cannot see it.
      - name: Guest diagnostics on failure
        if: failure()
        run: |
          limactl list || true
          limactl shell code-sandbox sudo journalctl -u sandbox-boot.service --no-pager || true
          limactl shell code-sandbox sudo cat /var/log/cloud-init-output.log || true
          limactl shell code-sandbox sudo cat /run/firewall-verify || true
