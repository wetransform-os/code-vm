# Rendered by code-vm from ~/.config/code-vm/config.yaml. Do not edit by hand:
# `code-vm` regenerates this file on every start.
minimumLimaVersion: 2.2.0

# Only the image is inherited. The upstream default mounts section is
# deliberately NOT inherited: it mounts the host $HOME read-only, which would
# expose ~/.ssh and ~/.aws.
base:
- template:_images/ubuntu-lts

# The hypervisor. "qemu" is accelerated by KVM on Linux; "vz" is Apple's
# Virtualization.framework, which runs on Hypervisor.framework (HVF) and is the
# accelerated path on macOS. Pinned by code-vm rather than left to Lima's own
# default, because the mount type below depends on it: virtiofs with QEMU on Linux
# and with vz on macOS.
vmType: "qemu"

cpus: 4
memory: "12GiB"
disk: "100GiB"

# containerd is not used; Docker is installed by provisioning instead.
containerd:
  system: false
  user: false

# Lima's own guest user. Privileged, used only by code-vm for session setup.
# The agent runs as devuser (UID 1000), created by provisioning
# with no sudo. UID 60000 avoids colliding with the host UID.
user:
  name: limaadmin
  uid: 60000
  comment: "code-vm admin"
  passwordlessSudo: true

ssh:
  # Do not copy host SSH public keys into the guest.
  loadDotSSHPubKeys: false

mounts:
- location: "/home/st/projects"
  mountPoint: "/home/st/projects"
  writable: true
- location: "/home/st/work/other"
  mountPoint: "/home/st/work/other"
  writable: true
# virtiofs preserves host UIDs, which is what makes the agent's UID match the
# host user's and keeps workspace files host-owned. An SSH-based reverse mount
# would map ownership to the SSH user and break that. Provided by virtiofsd
# under QEMU on Linux and by Virtualization.framework under vz on macOS, which
# is why the driver above is not a free choice.
mountType: virtiofs

# No automatic port forwarding: nothing in the guest needs to be reachable
# from the host, and the Docker socket is deliberately not exposed.
# guestIP 0.0.0.0 (with guestIPMustBeZero left false) matches every bind
# address and proto:any covers UDP — a bare guestPortRange ignore was observed
# to still forward wildcard-bound TCP ports like Squid's 3128.
portForwards:
- guestIP: "0.0.0.0"
  guestPortRange: [1, 65535]
  proto: any
  ignore: true

hostResolver:
  hosts: {}

provision:
- mode: data
  path: "/etc/sandbox/provision.env"
  owner: "root:root"
  permissions: "0444"
  overwrite: true
  content: |
    # Written by code-vm. Sourced by the guest provisioning scripts.
    AGENT_USER=devuser
    AGENT_UID=1000
    AGENT_GID=1000
    EXTRA_ALLOWED_DOMAINS="registry.example.com raw.githubusercontent.com"
    CONTAINER_PROXY=false
- mode: data
  path: "/usr/local/share/sandbox-profiles/manifest.env"
  owner: "root:root"
  permissions: "0444"
  overwrite: true
  content: |
    # Written by code-vm. Sourced by provision-system.sh and apply-profiles.sh.
    PROFILES="fixture"
    PROFILE_PACKAGES="fish"
    PROFILE_SHELL="/usr/bin/fish"
    PROFILE_HOOKS="fixture"
- mode: data
  path: "/usr/local/share/sandbox-profiles/fixture/files/.claude/CLAUDE.md"
  owner: "root:root"
  permissions: "0444"
  overwrite: true
  content: |
    # rules
- mode: data
  path: "/usr/local/share/sandbox-profiles/fixture/files.list"
  owner: "root:root"
  permissions: "0444"
  overwrite: true
  content: |
    .claude/CLAUDE.md
- mode: data
  path: "/usr/local/share/sandbox-profiles/fixture/hook"
  owner: "root:root"
  permissions: "0555"
  overwrite: true
  content: |
    #!/bin/bash
    echo hook
- mode: data
  path: "/usr/local/lib/sandbox/example.sh"
  owner: "root:root"
  permissions: "0755"
  overwrite: true
  content: |
    #!/bin/bash
    echo hi
- mode: system
  script: |
    #!/bin/bash
    set -euo pipefail
    exec /usr/local/lib/sandbox/provision-system.sh

probes:
# sandbox-boot.sh writes /run/sandbox-boot-complete as its final act, and only
# reaches it if the firewall verified (init-firewall.sh exits non-zero otherwise)
# and the agent CLI update has finished. Waiting on that file — rather than on
# the firewall's own verify file — is what makes `limactl start` return only when
# the VM is genuinely usable: no unfiltered egress, and no CLI still downloading.
# The failure marker turns a broken boot into an immediate failure rather than a
# silent five-minute timeout.
- mode: readiness
  description: sandbox boot sequence to finish
  script: |
    #!/bin/bash
    set -eu
    timeout 300s bash -c 'until [ -f /run/sandbox-boot-complete ]; do
      if [ -f /run/sandbox-boot-failed ]; then
        echo "the sandbox boot sequence failed; the firewall is not up" >&2
        exit 1
      fi
      sleep 2
    done'
  hint: |
    The sandbox boot sequence did not finish, so the egress firewall is not
    verified and the VM is deliberately not reported ready. Inspect it with:
      limactl shell code-sandbox sudo journalctl -u sandbox-boot.service
