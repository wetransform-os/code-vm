# Installed by code-vm. Lima writes a new cloud-init instance-id on every
# boot, so cloud-init treats each start as a fresh machine and, with its
# default ssh_deletekeys, regenerates the SSH host keys. Every ssh client and
# Orca would then refuse the guest after each restart. Keep the keys the
# guest already has; `code-vm recreate` still produces a new set.
ssh_deletekeys: false
